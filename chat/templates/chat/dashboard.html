{% extends 'chat/base.html' %}

{% block title %}Dental Assistant - SuperMouth{% endblock %}

{% block content %}
<div class="dental-container">

    <!-- Enhanced Chat Interface -->
    <div class="dental-chat-container">

        <!-- Chat Messages Area -->
        <div class="chat-messages" id="conversationHistory">
            
           
        </div>

        <!-- Control Buttons -->
        <div class="dental-controls">
            <button id="talkBtn" class="dental-btn">
                <div class="btn-icon">
                    <i class="fas fa-microphone"></i>
                </div>
                <div class="btn-text">
                    <span class="btn-main">Start Assessment</span>
                    <span class="btn-sub">Tap to begin your dental assessment</span>
                </div>
            </button>
            
            <button id="pauseBtn" class="dental-btn pause-btn" style="display: none;">
                <div class="btn-icon">
                    <i class="fas fa-pause"></i>
        </div>
                <div class="btn-text">
                    <span class="btn-main">Pause Assessment</span>
                    <span class="btn-sub">Hold current conversation</span>
    </div>
            </button>
            
            <button id="resumeBtn" class="dental-btn resume-btn" style="display: none;">
                <div class="btn-icon">
                    <i class="fas fa-play"></i>
                </div>
                <div class="btn-text">
                    <span class="btn-main">Resume Assessment</span>
                    <span class="btn-sub">Continue conversation</span>
                </div>
            </button>
        </div>
    </div>



</div>

  <style>
   
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #f8fffe 0%, #e8f5f3 50%, #f0f9ff 100%);
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
    }


    .dental-container {
        min-height: 100vh;
        padding: 20px;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        position: relative;
        overflow-x: hidden;
        animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Header Section  */
    .dental-header {
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 58, 138, 0.95) 100%);
        backdrop-filter: blur(20px);
        padding: 60px 40px;
        margin: -20px -20px 50px -20px;
        text-align: center;
        position: relative;
        overflow: hidden;
        border-bottom: 1px solid rgba(14, 165, 233, 0.2);
    }

    .dental-header::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="50" cy="50" r="0.5" fill="white" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
        opacity: 0.3;
        animation: float 20s ease-in-out infinite;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
    }

    .dental-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        margin-bottom: 15px;
        position: relative;
        z-index: 2;
        animation: slideInLeft 1s ease-out;
    }

    @keyframes slideInLeft {
        from { opacity: 0; transform: translateX(-50px); }
        to { opacity: 1; transform: translateX(0); }
    }

    .dental-logo i {
        font-size: 3rem;
        color: #0ea5e9;
        animation: professionalPulse 3s infinite;
        text-shadow: 0 4px 20px rgba(14, 165, 233, 0.3);
    }

    @keyframes professionalPulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
    }

    .dental-logo h1 {
        color: #ffffff;
        font-size: 3rem;
        font-weight: 900;
        margin: 0;
        letter-spacing: 2px;
        text-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        background: linear-gradient(135deg, #ffffff 0%, #e0f2fe 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        position: relative;
        font-family: 'Playfair Display', serif;
    }

    .dental-logo h1::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 3px;
        background: linear-gradient(90deg, #0ea5e9, #22c55e);
        border-radius: 2px;
    }

    .dental-subtitle {
        color: #e0f2fe;
        font-size: 1.2rem;
        margin: 0;
        font-weight: 300;
        letter-spacing: 1px;
        opacity: 0.9;
        animation: fadeInUp 1s ease-out 0.3s both;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .dental-chat-container {
        max-width: 800px;
        margin: 0 auto;
        background: transparent;
        border-radius: 0;
        box-shadow: none;
        border: none;
        backdrop-filter: none;
        position: relative;
        overflow: hidden;
        animation: slideUp 0.8s ease-out;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        height: 80vh;
        display: flex;
        flex-direction: column;
    }

    .dental-chat-container::before {
        display: none;
    }

    .dental-chat-container:hover {
        transform: none;
        box-shadow: none;
    }


    /* Chat Messages Area */
    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px 25px;
        background: transparent;
        position: relative;
    }

    .chat-messages::-webkit-scrollbar {
        width: 6px;
    }

    .chat-messages::-webkit-scrollbar-track {
        background: rgba(14, 165, 233, 0.1);
        border-radius: 3px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
        background: rgba(14, 165, 233, 0.3);
        border-radius: 3px;
    }

    .chat-messages::-webkit-scrollbar-thumb:hover {
        background: rgba(14, 165, 233, 0.5);
    }

    /* Welcome Message */
    .welcome-message {
        margin-bottom: 20px;
        animation: slideInFromTop 0.6s ease-out;
    }

    .welcome-bubble {
        background: linear-gradient(135deg, #0ea5e9 0%, #22c55e 100%);
        color: white;
        padding: 20px;
        border-radius: 20px 20px 20px 8px;
        box-shadow: 0 8px 25px rgba(14, 165, 233, 0.3);
        position: relative;
        max-width: 85%;
    }

    .bubble-content {
        flex: 1;
    }

    .bubble-content p {
        margin: 0 0 8px 0;
        line-height: 1.5;
        font-size: 1rem;
    }

    .message-time {
        font-size: 0.75rem;
        opacity: 0.6;
        font-weight: 400;
        color: #6c757d;
        margin-top: 4px;
    }

    @keyframes slideUp {
        from { 
            opacity: 0; 
            transform: translateY(30px) scale(0.95); 
        }
        to { 
            opacity: 1; 
            transform: translateY(0) scale(1); 
        }
    }


    .conversation-history::-webkit-scrollbar {
        width: 6px;
    }

    .conversation-history::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
    }

    .conversation-history::-webkit-scrollbar-thumb {
        background: rgba(14, 165, 233, 0.3);
        border-radius: 3px;
    }

    .conversation-history::-webkit-scrollbar-thumb:hover {
        background: rgba(14, 165, 233, 0.5);
    }

    .message-item {
        margin-bottom: 20px;
        display: flex;
        align-items: flex-start;
        animation: slideInMessage 0.4s ease-out;
        gap: 12px;
    }

    .message-item.ai-message {
        justify-content: flex-start;
    }

    .message-item.user-message {
        justify-content: flex-end;
    }

    @keyframes slideInMessage {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* AI Message Container */
    .ai-message-container {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 30px;
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        opacity: 0;
        transform: translateY(20px);
        animation: slideInFromCenter 0.6s ease-out forwards;
        position: relative;
        z-index: 2;
    }

    .ai-message-container.show {
        opacity: 1;
        transform: translateY(0);
    }

    @keyframes slideInFromCenter {
        from { 
            opacity: 0; 
            transform: translateY(20px) scale(0.95); 
        }
        to { 
            opacity: 1; 
            transform: translateY(0) scale(1); 
        }
    }

    .ai-message-container.fade-out {
        opacity: 0;
        transform: translateY(-20px);
    }

    .ai-message-container.fade-in {
        opacity: 1;
        transform: translateY(0);
        animation: slideInBubble 0.5s ease-out;
    }

    @keyframes slideInBubble {
        from { 
            opacity: 0; 
            transform: translateY(20px); 
        }
        to { 
            opacity: 1; 
            transform: translateY(0); 
        }
    }

    .ai-bubble {
        background: linear-gradient(135deg, #f8fffe 0%, #e8f5f3 50%, #f0f9ff 100%);
        color: #2c3e50;
        padding: 20px;
        border-radius: 20px 20px 20px 8px;
        box-shadow: none;
        max-width: 85%;
        position: relative;
        animation: slideInFromLeft 0.4s ease-out;
        transition: all 0.2s ease;
        text-align: left;
        border: 2px solid #1e3a8a;
        transform: translateY(0);
        opacity: 1;
    }

    .ai-bubble:hover {
        box-shadow: none;
    }

    @keyframes slideInFromCenter {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }


    .ai-text {
        font-size: 1.1rem;
        line-height: 1.6;
        margin: 0 0 8px 0;
        font-weight: 500;
        color: #2c3e50;
        text-shadow: none;
        position: relative;
        z-index: 2;
        transition: all 0.2s ease;
    }


    .user-text {
        font-size: 1rem;
        line-height: 1.5;
        margin: 0 0 8px 0;
        font-weight: 400;
        color: #2c3e50;
        position: relative;
        z-index: 2;
        transition: all 0.2s ease;
    }

    /* User Answer Bubble (Right) */
    .user-message {
        display: flex;
        justify-content: flex-end;
        align-items: flex-start;
        gap: 12px;
        transition: all 0.5s ease-out;
        opacity: 1;
        transform: translateY(0);
    }

    .user-message.fade-out {
        opacity: 0;
        transform: translateY(-20px);
    }

    .user-bubble {
        background: linear-gradient(135deg, #f8fffe 0%, #e8f5f3 50%, #f0f9ff 100%);
        color: #2c3e50;
        padding: 16px 20px;
        border-radius: 8px 8px 4px 8px;
        box-shadow: none;
        max-width: 75%;
        position: relative;
        animation: slideInFromRight 0.4s ease-out;
        transition: all 0.2s ease;
        transform: translateY(0);
        opacity: 1;
        border: 2px solid #1e3a8a;
    }

    .user-bubble:hover {
        box-shadow: none;
    }

    @keyframes slideInFromRight {
        from { 
            transform: translateX(20px); 
            opacity: 0; 
        }
        to { 
            transform: translateX(0); 
            opacity: 1; 
        }
    }

    @keyframes slideInFromLeft {
        from { 
            transform: translateX(-20px); 
            opacity: 0; 
        }
        to { 
            transform: translateX(0); 
            opacity: 1; 
        }
    }

    @keyframes statusPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }

    .user-bubble::before {
        content: '';
        position: absolute;
        right: -8px;
        bottom: 8px;
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 0 0 8px 8px;
        border-color: transparent transparent transparent #059669;
    }

    .user-avatar {
        background: linear-gradient(135deg, #10b981, #059669);
        border-radius: 50%;
        width: 35px;
        height: 35px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 3px 12px rgba(16, 185, 129, 0.3);
    }

    .user-avatar i {
        font-size: 1rem;
        color: white;
    }
    /* Professional Control Button */

    .dental-controls {
        text-align: center;
        padding: 20px 25px;
        background: transparent;
        border-radius: 0;
        position: relative;
        z-index: 2;
        border: none;
        display: flex;
        flex-direction: row;
        gap: 15px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
    }

    .dental-btn {
        background: #4A148C;
        color: white;
        border: none;
        border-radius: 25px;
        padding: 10px 20px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: none;
        font-size: 0.85rem;
        font-weight: 500;
        position: relative;
        min-width: 120px;
        justify-content: center;
    }

    .dental-btn:hover {
        background: linear-gradient(135deg, #4A148C 0%, #4A148C 100%);
        box-shadow: none;
    }

    .pause-btn {
        background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
        box-shadow: 0 2px 8px rgba(139, 92, 246, 0.2);
        border-radius: 25px;
        padding: 10px 20px;
        font-size: 0.85rem;
        min-width: 120px;
    }

    .pause-btn:hover {
        background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
        box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }

    .resume-btn {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        box-shadow: 0 2px 8px rgba(16, 185, 129, 0.2);
        border-radius: 25px;
        padding: 10px 20px;
        font-size: 0.85rem;
        min-width: 120px;
    }

    .resume-btn:hover {
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }



    .dental-btn.recording {
        background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%) !important;
    }

    .dental-btn.loading {
        opacity: 0.7;
        pointer-events: none;
        position: relative;
    }

    .dental-btn.loading::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 20px;
        height: 20px;
        margin: -10px 0 0 -10px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top: 2px solid #ffffff;
        border-radius: 50%;
        
    }

   

    .btn-icon {
        font-size: 1.1rem;
       
    }

    .btn-text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }

    .btn-main {
        font-size: 1rem;
        font-weight: 700;
    }

    .btn-sub {
        font-size: 0.8rem;
        font-weight: 400;
        opacity: 0.9;
    }

    /* Status Indicator */
    .status-indicator {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 40px;
        color: #475569;
        font-size: 1rem;
        font-weight: 500;
    }

    .status-dot {
        width: 10px;
        height: 10px;
        background: #0ea5e9;
        border-radius: 50%;
        animation: statusPulse 2.5s infinite;
        box-shadow: 0 0 10px rgba(14, 165, 233, 0.3);
    }

    @keyframes statusPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.1); }
    }


    .conversation-entry {
        margin-bottom: 25px;
        padding: 20px;
        background: white;
        border-radius: 15px;
        border-left: 5px solid #1e3a8a;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        transition: all 0.3s ease;
    }

    .conversation-entry:hover {
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    }

    .conversation-entry.user {
        border-left-color: #10b981;
    }

    .conversation-entry.ai {
        border-left-color: #1e3a8a;
    }

    .conversation-entry h4 {
        margin: 0 0 10px 0;
        font-size: 1rem;
        font-weight: 700;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .conversation-entry p {
        margin: 0;
        font-size: 1rem;
        line-height: 1.6;
        color: #334155;
    }

    .language-warning {
        background: #fef3c7;
        border: 1px solid #f59e0b;
        color: #92400e;
        padding: 10px 15px;
        border-radius: 8px;
        font-size: 0.9rem;
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 500;
    }

    .language-warning i {
        font-size: 1.1rem;
    }

    /* Patient Information Styles */
    .patient-info-header {
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        border-radius: 15px;
        padding: 25px;
        margin-bottom: 25px;
        border: 2px solid #e2e8f0;
    }

    .patient-details h3 {
        color: #1e3a8a;
        margin: 0 0 20px 0;
        font-size: 1.2rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .info-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
    }

    .info-item {
        background: white;
        padding: 15px;
        border-radius: 10px;
        border-left: 4px solid #1e3a8a;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .info-item strong {
        color: #1e3a8a;
        font-weight: 600;
    }

    /* JSON Data Section */
    .json-data-section {
        background: #f8fafc;
        border-radius: 15px;
        padding: 25px;
        margin-bottom: 25px;
        border: 2px solid #e2e8f0;
    }

    .json-header h3 {
        color: #1e3a8a;
        margin: 0 0 15px 0;
        font-size: 1.2rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .json-content {
        background: #1e3a8a;
        color: #f8fafc;
        border-radius: 10px;
        padding: 20px;
        overflow-x: auto;
    }

    .json-content pre {
        margin: 0;
        font-family: 'Courier New', monospace;
        font-size: 0.9rem;
        line-height: 1.4;
        white-space: pre-wrap;
        word-wrap: break-word;
    }

    .json-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }

    .download-json-btn {
        background: #10b981;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 0.9rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: background 0.2s;
    }

    .download-json-btn:hover {
        background: #059669;
    }

    .no-json-section {
        background: #f8fafc;
        border-radius: 15px;
        padding: 25px;
        margin-bottom: 25px;
        border: 2px solid #e2e8f0;
        text-align: center;
    }

    .no-json-message {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: #6b7280;
        font-size: 1rem;
    }

    .no-json-message i {
        font-size: 1.2rem;
        color: #9ca3af;
    }

    /* JSON Extraction Indicator */
    .json-extraction-indicator {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #10b981;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        z-index: 1000;
        animation: slideInRight 0.3s ease-out;
    }

    .json-indicator-content {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
    }

    .json-indicator-content i {
        font-size: 1.2rem;
    }

    @keyframes slideInRight {
        from {
            transform: translateX(100%);
            opacity: 0;
        }
        to {
            transform: translateX(0);
            opacity: 1;
        }
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .dental-logo {
            flex-direction: column;
            gap: 15px;
        }

        .dental-logo h1 {
            font-size: 2.2rem;
        }

        .ai-bubble, .user-bubble {
            max-width: 85%;
            padding: 18px 22px;
        }

        .dental-btn {
            padding: 20px 40px;
            flex-direction: column;
            gap: 15px;
        }

        .dental-chat-container {
            padding: 20px;
        }

        .storage-header {
            flex-direction: column;
            gap: 20px;
            text-align: center;
        }

        .storage-actions {
            flex-wrap: wrap;
            justify-content: center;
        }
    }

    /* Records Modal Styles */
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(5px);
        animation: fadeIn 0.3s ease;
    }

    .modal-content {
        background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
        margin: 2% auto;
        padding: 0;
        border: none;
        border-radius: 20px;
        width: 90%;
        max-width: 1000px;
        max-height: 90vh;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        animation: slideIn 0.3s ease;
    }

    .record-detail-content {
        max-width: 800px;

// Convert Float32Array to 16-bit PCM 
function floatTo16BitPCM(float32Array) {
    const buffer = new ArrayBuffer(float32Array.length * 2);
    const view = new DataView(buffer);
    let offset = 0;
    for (let i = 0; i < float32Array.length; i++, offset += 2) {
        let s = Math.max(-1, Math.min(1, float32Array[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
    return buffer;
}

// Resample audio from source rate to 16kHz 
function resampleTo16kHz(audioBuffer, sourceSampleRate) {
    if (sourceSampleRate === 16000) {
        return audioBuffer;
    }
    const ratio = sourceSampleRate / 16000;
    const newLength = Math.round(audioBuffer.length / ratio);
    const result = new Float32Array(newLength);
    let offsetResult = 0;
    let offsetBuffer = 0;
    while (offsetResult < result.length) {
        const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
        let accum = 0, count = 0;
        for (let i = offsetBuffer; i < nextOffsetBuffer && i < audioBuffer.length; i++) {
            accum += audioBuffer[i];
            count++;
        }
        result[offsetResult] = accum / count;
        offsetResult++;
        offsetBuffer = nextOffsetBuffer;
    }
    return result;
}

// Audio playback functions 
async function playNextInQueue() {
    console.log(' playNextInQueue called');
    console.log(' isPlaying:', isPlaying);
    console.log(' audioQueue.length:', audioQueue.length);
    console.log(' audioContext exists:', !!audioContext);
    
    if (isPlaying || audioQueue.length === 0) {
        console.log(' Not playing - isPlaying:', isPlaying, 'queue length:', audioQueue.length);
        return;
    }
    
    isPlaying = true;
    const pcmData = audioQueue.shift();
    console.log('🎵 Playing audio chunk:', pcmData.byteLength, 'bytes');
    
    try {
        console.log(' Converting PCM to AudioBuffer...');
        const audioBuffer = await pcmToAudioBuffer(pcmData);
        console.log(' AudioBuffer created:', audioBuffer.length, 'samples,', audioBuffer.sampleRate, 'Hz');
        
        const source = audioContext.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioContext.destination);
        
        source.onended = () => {
            console.log('🎵 Audio playback ended');
            isPlaying = false;
            playNextInQueue();
        };
        
        console.log('Starting audio playback...');
        source.start(0);

    } catch (e) {

        isPlaying = false;
        playNextInQueue();
    }
}

// Convert PCM data to AudioBuffer 
async function pcmToAudioBuffer(pcmData) {
    console.log(' pcmToAudioBuffer called with:', pcmData.byteLength, 'bytes');
    
    const dataView = new DataView(pcmData);
    const samples = new Float32Array(dataView.byteLength / 2);
    console.log(' Creating samples array with', samples.length, 'samples');
    
    for (let i = 0; i < samples.length; i++) {
        const int16 = dataView.getInt16(i * 2, true);
        samples[i] = int16 / (int16 < 0 ? 0x8000 : 0x7FFF);
    }
    
    console.log(' Sample range:', Math.min(...samples), 'to', Math.max(...samples));
    console.log(' Creating AudioBuffer with 24000 Hz sample rate');
    
    const audioBuffer = audioContext.createBuffer(1, samples.length, 24000);
    audioBuffer.getChannelData(0).set(samples);
    
    console.log(' AudioBuffer created successfully');
    return audioBuffer;
}

// Connect to WebSocket 
function connectWebSocket() {

    console.log(' Connecting to WebSocket:', wsUrl);
    console.log(' Current location:', window.location.href);
    console.log(' Host:', window.location.host);
    
    websocket = new WebSocket(wsUrl);
    websocket.binaryType = 'arraybuffer';
    
    websocket.onopen = () => {
      console.log('WebSocket connected successfully');
      console.log('WebSocket readyState:', websocket.readyState);
      updateStatus('Connected - Starting microphone...');
      resolve();
    };
    
    websocket.onmessage = (event) => {

      updateStatus('Connection error - please try again');
      reject(error);

    websocket.onclose = (event) => {

  });

async function checkMicrophonePermission() {

    stream.getTracks().forEach(track => track.stop());
    return true;
  } catch (error) {

    return false;
  }
}

              }, 1500); // Wait 1.5 seconds for the message to be fully displayed
            }
            
            // Reset AI response state
            currentAIMessage = null;
            isAITyping = false;
            isAIResponding = false;
            aiMessageBuffer = '';
          }
        }, 2000); // Wait 2 seconds after last chunk
      }
    }
    // Handle binary audio data 
    else if (event.data instanceof ArrayBuffer) {
      console.log('Received audio from AI:', event.data.byteLength, 'bytes');
      console.log('Audio queue length before:', audioQueue.length);
      console.log('Is playing:', isPlaying);
      console.log('Audio context exists:', !!audioContext);
      
      audioQueue.push(event.data);
      console.log('Audio queue length after:', audioQueue.length);
      
      if (!isPlaying && audioContext) {
        console.log('Starting audio playback...');
        playNextInQueue();
      } else {
        console.log('Audio not started - isPlaying:', isPlaying, 'audioContext:', !!audioContext);
      }
    }
    
  } catch (error) {
    console.error('Error parsing WebSocket message:', error);
  }
}

// Create message bubble
function createMessageBubble(role, text) {
  const messageItem = document.createElement('div');
  messageItem.className = `message-item ${role}-message`;
  
  const bubble = document.createElement('div');
  bubble.className = role === 'ai' ? 'ai-bubble' : 'user-bubble';
  
  // Create content container
  const content = document.createElement('div');
  content.className = 'bubble-content';
  
  // Create text element
  const textElement = document.createElement('p');
  textElement.textContent = text;
  textElement.className = role === 'ai' ? 'ai-text' : 'user-text';
  
  // Create timestamp
  const timestamp = document.createElement('div');
  timestamp.className = 'message-time';
  timestamp.textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  
  // Assemble the bubble
  content.appendChild(textElement);
  content.appendChild(timestamp);
  bubble.appendChild(content);
  
  // Style positioning
  if (role === 'user') {
    messageItem.style.justifyContent = 'flex-end';
    messageItem.style.display = 'flex';
    bubble.style.marginLeft = 'auto';
    bubble.style.maxWidth = '70%';
  } else {
    messageItem.style.justifyContent = 'flex-start';
    messageItem.style.display = 'flex';
    bubble.style.marginRight = 'auto';
    bubble.style.maxWidth = '85%';
  }
  
  messageItem.appendChild(bubble);
  return messageItem;
}

// Pause conversation
async function pauseConversation() {
  console.log("Pausing conversation...");
  console.log("isRecording:", isRecording, "isPaused:", isPaused);
  
  if (isRecording && !isPaused) {
    isPaused = true;
    isRecording = false;
    
    // Stop microphone but keep WebSocket and session alive
    if (microphone) {
      microphone.disconnect();
      processor.disconnect();
      microphone.mediaStream.getTracks().forEach(track => track.stop());
      microphone = null;
      processor = null;
    }
    
    // Keep WebSocket connection alive - don't close it!
    // websocket stays connected
    
    updateButtonStates('paused');
    updateStatus('Session paused - conversation held');
    console.log("Conversation paused successfully");
  } else {
    console.log("Cannot pause - not recording or already paused");
  }
}

// Resume conversation
async function resumeConversation() {
  console.log("Resuming conversation...");
  console.log("isPaused:", isPaused, "isRecording:", isRecording);
  
  if (isPaused) {
    isPaused = false;
    
    // Wave animation removed
    
    // Reconnect to WebSocket if needed (should still be connected)
    if (!websocket || websocket.readyState === WebSocket.CLOSED) {
      console.log("Reconnecting WebSocket...");
      await connectWebSocket();
    }
    
    // Restart microphone
    console.log("Restarting microphone...");
    await startMicrophone();
    
    isRecording = true;
    updateButtonStates('recording');
    updateStatus('Listening... Speak now');
    console.log("Conversation resumed successfully");
  } else {
    console.log("Cannot resume - not paused");
  }
}

// Start analyzing animation
function startAnalyzingAnimation() {
  const steps = document.querySelectorAll('.analyzing-step');
  let currentStep = 0;
  
  const analyzingInterval = setInterval(() => {
    if (currentStep < steps.length) {
      // Complete previous step
      if (currentStep > 0) {
        steps[currentStep - 1].classList.remove('active');
        steps[currentStep - 1].classList.add('completed');
      }
      
      // Activate current step
      if (currentStep < steps.length) {
        steps[currentStep].classList.add('active');
      }
      
      currentStep++;
    } else {
      clearInterval(analyzingInterval);
      // Complete all steps and redirect to cart after animation
      setTimeout(() => {
        // Complete the last step
        steps[steps.length - 1].classList.remove('active');
        steps[steps.length - 1].classList.add('completed');
        
        // Animation complete - trigger cart addition
        console.log("Animation complete - triggering cart addition...");
        
        // Trigger cart addition with the conversation data
        if (conversationData && conversationData.messages && conversationData.messages.length > 0) {
          console.log("Calling processConversationWithLLM from animation...");
          processConversationWithLLM();
        } else {
          console.log("No conversation data available for cart addition");
        }
      }, 2000);
    }
  }, 2500); // Change step every 2.5 seconds for longer animation
}

// Add products to cart and redirect to cart page
async function addProductsToCartAndRedirect(result) {
  console.log("===== ADDING PRODUCTS TO CART =====");
  console.log("Full result object:", result);
  
  try {
    const products = result.final_products || result.filtered_products || [];
    console.log(`Adding ${products.length} products to cart`);
    console.log("Products array:", products);
    
    if (products.length === 0) {
      console.log("No products to add to cart");
      console.log("Available keys in result:", Object.keys(result));
      // Still redirect to cart even if empty
      setTimeout(() => {
        window.location.href = '/cart/';
      }, 1000);
      return;
    }
    
    // Check if user is authenticated
    const csrfToken = getCookie('csrftoken');
    if (!csrfToken) {
      console.error("CSRF token not found - user may not be authenticated");
      console.log("Redirecting to login...");
      window.location.href = '/login/';
      return;
    }
    
    // Prepare products for cart API using product names instead of IDs
    const cartProducts = products.map(product => ({
      name: product.name,
      quantity: 1
    }));
    
    console.log("Cart products to add (by name):", cartProducts);
    console.log("CSRF Token:", csrfToken);
    console.log("Request payload:", JSON.stringify({
      products: cartProducts
    }));
    
    // Add products to cart
    console.log("Making cart API call to /api/cart/add/");
    const response = await fetch('/api/cart/add/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': csrfToken
      },
      body: JSON.stringify({
        products: cartProducts
      })
    });
    
    console.log("Cart API response status:", response.status);
    console.log("Cart API response headers:", response.headers);
    
    if (!response.ok) {
      console.error("Cart API returned error status:", response.status);
      const errorText = await response.text();
      console.error("Error response body:", errorText);
      return;
    }
    
    const cartResult = await response.json();
    console.log("Cart API response:", cartResult);
    
    if (cartResult.success) {
      console.log("Products added to cart successfully");
      console.log("Added items:", cartResult.added_items);
      console.log("Total items added:", cartResult.added_items ? cartResult.added_items.length : 0);
      
      // Redirect to cart page after successful addition
      console.log("Redirecting to cart page...");
      setTimeout(() => {
        window.location.href = '/cart/';
      }, 1000);
      
    } else {
      console.error("Failed to add products to cart:", cartResult.error);
      console.log('Error adding products to cart');
    }
    
  } catch (error) {
    console.error("Error adding products to cart:", error);
    console.log('Error adding products to cart');
  }
}

// Get CSRF token
function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}

// Initialize the app when DOM is loaded
document.addEventListener('DOMContentLoaded', () => {
  console.log('Voice Chat App initializing...');
  
  // Test audio system capabilities
  testAudioSystem();
  
  const talkBtn = document.getElementById('talkBtn');
  
  if (!talkBtn) {
    console.error('Talk button not found');
    return;
  }
  
  // Add click event listeners
  talkBtn.onclick = async () => {
    console.log("Button clicked - isRecording:", isRecording, "isPaused:", isPaused, "isProcessing:", isProcessing);
    
    if (isProcessing) {
      console.log("Already processing - ignoring click");
      return;
    }
    
    // If not recording and not paused, start conversation
    if (!isRecording && !isPaused) {
      console.log("Starting conversation...");
      await startConversation();
    } else {
      // If recording OR paused, stop the conversation
      console.log("Stopping conversation...");
      await stopConversation();
    }
  };
  
  // Add pause button event listener
  const pauseBtn = document.getElementById('pauseBtn');
  if (pauseBtn) {
    pauseBtn.onclick = async () => {
      await pauseConversation();
    };
  }
  
  // Add resume button event listener
  const resumeBtn = document.getElementById('resumeBtn');
  if (resumeBtn) {
    resumeBtn.onclick = async () => {
      await resumeConversation();
    };
  }
  
  // Ensure initial state is properly set
  isRecording = false;
  isPaused = false;
  isProcessing = false;
  
  // Reset button to initial state
  if (talkBtn) {
    talkBtn.disabled = false;
    talkBtn.style.opacity = '1';
    talkBtn.classList.remove('recording');
    talkBtn.querySelector('.btn-main').textContent = 'Start Assessment';
    talkBtn.querySelector('.btn-sub').textContent = 'Tap to begin your dental assessment';
    console.log("Initial button state set to Start Assessment");
  }
  
  // Force initial button state
  setTimeout(() => {
    updateButtonStates('stopped');
  }, 100);
  
  console.log('Voice Chat App ready!');
  console.log('Initial state - isRecording:', isRecording, 'isPaused:', isPaused, 'isProcessing:', isProcessing);
  
 
});
</script>
