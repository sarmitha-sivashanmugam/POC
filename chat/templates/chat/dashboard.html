{% extends 'chat/base.html' %}

{% block title %}Dental Assistant - SuperMouth{% endblock %}

{% block content %}
<div class="dental-container">

    <!-- Enhanced Chat Interface -->
    <div class="dental-chat-container">

        <!-- Chat Messages Area -->
        <div class="chat-messages" id="conversationHistory">
            
           
        </div>

        <!-- Control Buttons -->
        <div class="dental-controls">
            <button id="talkBtn" class="dental-btn">
                <div class="btn-icon">
                    <i class="fas fa-microphone"></i>
                </div>
                <div class="btn-text">
                    <span class="btn-main">Start Assessment</span>
                    <span class="btn-sub">Tap to begin your dental assessment</span>
                </div>
            </button>
            
            <button id="pauseBtn" class="dental-btn pause-btn" style="display: none;">
                <div class="btn-icon">
                    <i class="fas fa-pause"></i>
        </div>
                <div class="btn-text">
                    <span class="btn-main">Pause Assessment</span>
                    <span class="btn-sub">Hold current conversation</span>
    </div>
            </button>
            
            <button id="resumeBtn" class="dental-btn resume-btn" style="display: none;">
                <div class="btn-icon">
                    <i class="fas fa-play"></i>
                </div>
                <div class="btn-text">
                    <span class="btn-main">Resume Assessment</span>
                    <span class="btn-sub">Continue conversation</span>
                </div>
            </button>
        </div>
    </div>



</div>

  <style>
   
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #f8fffe 0%, #e8f5f3 50%, #f0f9ff 100%);
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
    }


    .dental-container {
        min-height: 100vh;
        padding: 20px;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        position: relative;
        overflow-x: hidden;
        animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Header Section  */
    .dental-header {
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 58, 138, 0.95) 100%);
        backdrop-filter: blur(20px);
        padding: 60px 40px;
        margin: -20px -20px 50px -20px;
        text-align: center;
        position: relative;
        overflow: hidden;
        border-bottom: 1px solid rgba(14, 165, 233, 0.2);
    }

    .dental-header::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="50" cy="50" r="0.5" fill="white" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
        opacity: 0.3;
        animation: float 20s ease-in-out infinite;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
    }

    .dental-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        margin-bottom: 15px;
        position: relative;
        z-index: 2;
        animation: slideInLeft 1s ease-out;
    }

    @keyframes slideInLeft {
        from { opacity: 0; transform: translateX(-50px); }
        to { opacity: 1; transform: translateX(0); }
    }

    .dental-logo i {
        font-size: 3rem;
        color: #0ea5e9;
        animation: professionalPulse 3s infinite;
        text-shadow: 0 4px 20px rgba(14, 165, 233, 0.3);
    }

    @keyframes professionalPulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
    }

    .dental-logo h1 {
        color: #ffffff;
        font-size: 3rem;
        font-weight: 900;
        margin: 0;
        letter-spacing: 2px;
        text-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        background: linear-gradient(135deg, #ffffff 0%, #e0f2fe 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        position: relative;
        font-family: 'Playfair Display', serif;
    }

    .dental-logo h1::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 3px;
        background: linear-gradient(90deg, #0ea5e9, #22c55e);
        border-radius: 2px;
    }

    .dental-subtitle {
        color: #e0f2fe;
        font-size: 1.2rem;
        margin: 0;
        font-weight: 300;
        letter-spacing: 1px;
        opacity: 0.9;
        animation: fadeInUp 1s ease-out 0.3s both;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .dental-chat-container {
        max-width: 800px;
        margin: 0 auto;
        background: transparent;
        border-radius: 0;
        box-shadow: none;
        border: none;
        backdrop-filter: none;
        position: relative;
        overflow: hidden;
        animation: slideUp 0.8s ease-out;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        height: 80vh;
        display: flex;
        flex-direction: column;
    }

    .dental-chat-container::before {
        display: none;
    }

    .dental-chat-container:hover {
        transform: none;
        box-shadow: none;
    }


    /* Chat Messages Area */
    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px 25px;
        background: transparent;
        position: relative;
    }

    .chat-messages::-webkit-scrollbar {
        width: 6px;
    }

    .chat-messages::-webkit-scrollbar-track {
        background: rgba(14, 165, 233, 0.1);
        border-radius: 3px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
        background: rgba(14, 165, 233, 0.3);
        border-radius: 3px;
    }

    .chat-messages::-webkit-scrollbar-thumb:hover {
        background: rgba(14, 165, 233, 0.5);
    }

    /* Welcome Message */
    .welcome-message {
        margin-bottom: 20px;
        animation: slideInFromTop 0.6s ease-out;
    }

    .welcome-bubble {
        background: linear-gradient(135deg, #0ea5e9 0%, #22c55e 100%);
        color: white;
        padding: 20px;
        border-radius: 20px 20px 20px 8px;
        box-shadow: 0 8px 25px rgba(14, 165, 233, 0.3);
        position: relative;
        max-width: 85%;
    }

    .bubble-content {
        flex: 1;
    }

    .bubble-content p {
        margin: 0 0 8px 0;
        line-height: 1.5;
        font-size: 1rem;
    }

    .message-time {
        font-size: 0.75rem;
        opacity: 0.6;
        font-weight: 400;
        color: #6c757d;
        margin-top: 4px;
    }

    @keyframes slideUp {
        from { 
            opacity: 0; 
            transform: translateY(30px) scale(0.95); 
        }
        to { 
            opacity: 1; 
            transform: translateY(0) scale(1); 
        }
    }


    .conversation-history::-webkit-scrollbar {
        width: 6px;
    }

    .conversation-history::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
    }

    .conversation-history::-webkit-scrollbar-thumb {
        background: rgba(14, 165, 233, 0.3);
        border-radius: 3px;
    }

    .conversation-history::-webkit-scrollbar-thumb:hover {
        background: rgba(14, 165, 233, 0.5);
    }

    .message-item {
        margin-bottom: 20px;
        display: flex;
        align-items: flex-start;
        animation: slideInMessage 0.4s ease-out;
        gap: 12px;
    }

    .message-item.ai-message {
        justify-content: flex-start;
    }

    .message-item.user-message {
        justify-content: flex-end;
    }

    @keyframes slideInMessage {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* AI Message Container */
    .ai-message-container {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 30px;
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        opacity: 0;
        transform: translateY(20px);
        animation: slideInFromCenter 0.6s ease-out forwards;
        position: relative;
        z-index: 2;
    }

    .ai-message-container.show {
        opacity: 1;
        transform: translateY(0);
    }

    @keyframes slideInFromCenter {
        from { 
            opacity: 0; 
            transform: translateY(20px) scale(0.95); 
        }
        to { 
            opacity: 1; 
            transform: translateY(0) scale(1); 
        }
    }

    .ai-message-container.fade-out {
        opacity: 0;
        transform: translateY(-20px);
    }

    .ai-message-container.fade-in {
        opacity: 1;
        transform: translateY(0);
        animation: slideInBubble 0.5s ease-out;
    }

    @keyframes slideInBubble {
        from { 
            opacity: 0; 
            transform: translateY(20px); 
        }
        to { 
            opacity: 1; 
            transform: translateY(0); 
        }
    }

    .ai-bubble {
        background: linear-gradient(135deg, #f8fffe 0%, #e8f5f3 50%, #f0f9ff 100%);
        color: #2c3e50;
        padding: 20px;
        border-radius: 20px 20px 20px 8px;
        box-shadow: none;
        max-width: 85%;
        position: relative;
        animation: slideInFromLeft 0.4s ease-out;
        transition: all 0.2s ease;
        text-align: left;
        border: 2px solid #1e3a8a;
        transform: translateY(0);
        opacity: 1;
    }

    .ai-bubble:hover {
        box-shadow: none;
    }

    @keyframes slideInFromCenter {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }


    .ai-text {
        font-size: 1.1rem;
        line-height: 1.6;
        margin: 0 0 8px 0;
        font-weight: 500;
        color: #2c3e50;
        text-shadow: none;
        position: relative;
        z-index: 2;
        transition: all 0.2s ease;
    }


    /* User Message Styles - Plain Text */
    .user-bubble {
        background: transparent;
        color: #2c3e50;
        padding: 0;
        border-radius: 0;
        box-shadow: none;
        max-width: 85%;
        position: relative;
        animation: slideInFromRight 0.4s ease-out;
        transition: all 0.2s ease;
        text-align: right;
    }

    .user-bubble:hover {
        box-shadow: none;
    }

    .user-text {
        font-size: 1rem;
        line-height: 1.6;
        margin: 0;
        font-weight: 400;
        text-shadow: none;
        position: relative;
        z-index: 2;
        transition: color 0.3s ease;
    }

    .user-text.interim {
        color: #9ca3af; /* Grey for interim results */
    }

    .user-text.final {
        color: #2c3e50; /* Black for final text */
    }

    /* AI Thinking Indicator */
    .ai-thinking {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 0;
        color: #6b7280;
        font-size: 0.9rem;
        font-style: italic;
        animation: fadeIn 0.3s ease;
        margin-bottom: 10px;
        text-align: left;
    }

    .ai-thinking.hidden {
        display: none;
    }

    .ai-thinking-dots {
        display: inline-block;
        position: relative;
        width: 20px;
        height: 10px;
    }

    .ai-thinking-dots span {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #6b7280;
        animation: thinkingDots 1.4s infinite ease-in-out;
    }

    .ai-thinking-dots span:nth-child(1) {
        left: 0;
        animation-delay: -0.32s;
    }

    .ai-thinking-dots span:nth-child(2) {
        left: 8px;
        animation-delay: -0.16s;
    }

    .ai-thinking-dots span:nth-child(3) {
        left: 16px;
        animation-delay: 0s;
    }

    @keyframes thinkingDots {
        0%, 80%, 100% {
            transform: scale(0.8);
            opacity: 0.5;
        }
        40% {
            transform: scale(1);
            opacity: 1;
        }
    }

    @keyframes slideInFromRight {
        from { 
            transform: translateX(20px); 
            opacity: 0; 
        }
        to { 
            transform: translateX(0); 
            opacity: 1; 
        }
    }

    @keyframes slideInFromLeft {
        from { 
            transform: translateX(-20px); 
            opacity: 0; 
        }
        to { 
            transform: translateX(0); 
            opacity: 1; 
        }
    }

    @keyframes statusPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }

    /* User bubble pseudo-element removed - user messages are hidden */
    /* Professional Control Button */

    .dental-controls {
        text-align: center;
        padding: 20px 25px;
        background: transparent;
        border-radius: 0;
        position: relative;
        z-index: 2;
        border: none;
        display: flex;
        flex-direction: row;
        gap: 15px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
    }

    .dental-btn {
        background: #4A148C;
        color: white;
        border: none;
        border-radius: 25px;
        padding: 10px 20px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: none;
        font-size: 0.85rem;
        font-weight: 500;
        position: relative;
        min-width: 120px;
        justify-content: center;
    }

    .dental-btn:hover {
        background: linear-gradient(135deg, #4A148C 0%, #4A148C 100%);
        box-shadow: none;
    }

    .pause-btn {
        background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
        box-shadow: 0 2px 8px rgba(139, 92, 246, 0.2);
        border-radius: 25px;
        padding: 10px 20px;
        font-size: 0.85rem;
        min-width: 120px;
    }

    .pause-btn:hover {
        background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
        box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }

    .resume-btn {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        box-shadow: 0 2px 8px rgba(16, 185, 129, 0.2);
        border-radius: 25px;
        padding: 10px 20px;
        font-size: 0.85rem;
        min-width: 120px;
    }

    .resume-btn:hover {
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }



    .dental-btn.recording {
        background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%) !important;
    }

    .dental-btn.loading {
        opacity: 0.7;
        pointer-events: none;
        position: relative;
    }

    .dental-btn.loading::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 20px;
        height: 20px;
        margin: -10px 0 0 -10px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top: 2px solid #ffffff;
        border-radius: 50%;
        
    }

   

    .btn-icon {
        font-size: 1.1rem;
       
    }

    .btn-text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }

    .btn-main {
        font-size: 1rem;
        font-weight: 700;
    }

    .btn-sub {
        font-size: 0.8rem;
        font-weight: 400;
        opacity: 0.9;
    }

    /* Status Indicator */
    .status-indicator {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 40px;
        color: #475569;
        font-size: 1rem;
        font-weight: 500;
    }

    .status-dot {
        width: 10px;
        height: 10px;
        background: #0ea5e9;
        border-radius: 50%;
        animation: statusPulse 2.5s infinite;
        box-shadow: 0 0 10px rgba(14, 165, 233, 0.3);
    }

    @keyframes statusPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.1); }
    }


    .conversation-entry {
        margin-bottom: 25px;
        padding: 20px;
        background: white;
        border-radius: 15px;
        border-left: 5px solid #1e3a8a;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        transition: all 0.3s ease;
    }

    .conversation-entry:hover {
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    }

    .conversation-entry.user {
        border-left-color: #10b981;
    }

    .conversation-entry.ai {
        border-left-color: #1e3a8a;
    }

    .conversation-entry h4 {
        margin: 0 0 10px 0;
        font-size: 1rem;
        font-weight: 700;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .conversation-entry p {
        margin: 0;
        font-size: 1rem;
        line-height: 1.6;
        color: #334155;
    }

    .language-warning {
        background: #fef3c7;
        border: 1px solid #f59e0b;
        color: #92400e;
        padding: 10px 15px;
        border-radius: 8px;
        font-size: 0.9rem;
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 500;
    }

    .language-warning i {
        font-size: 1.1rem;
    }

    /* Patient Information Styles */
    .patient-info-header {
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        border-radius: 15px;
        padding: 25px;
        margin-bottom: 25px;
        border: 2px solid #e2e8f0;
    }

    .patient-details h3 {
        color: #1e3a8a;
        margin: 0 0 20px 0;
        font-size: 1.2rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .info-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
    }

    .info-item {
        background: white;
        padding: 15px;
        border-radius: 10px;
        border-left: 4px solid #1e3a8a;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .info-item strong {
        color: #1e3a8a;
        font-weight: 600;
    }

    /* JSON Data Section */
    .json-data-section {
        background: #f8fafc;
        border-radius: 15px;
        padding: 25px;
        margin-bottom: 25px;
        border: 2px solid #e2e8f0;
    }

    .json-header h3 {
        color: #1e3a8a;
        margin: 0 0 15px 0;
        font-size: 1.2rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .json-content {
        background: #1e3a8a;
        color: #f8fafc;
        border-radius: 10px;
        padding: 20px;
        overflow-x: auto;
    }

    .json-content pre {
        margin: 0;
        font-family: 'Courier New', monospace;
        font-size: 0.9rem;
        line-height: 1.4;
        white-space: pre-wrap;
        word-wrap: break-word;
    }

    .json-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }

    .download-json-btn {
        background: #10b981;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 0.9rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: background 0.2s;
    }

    .download-json-btn:hover {
        background: #059669;
    }

    .no-json-section {
        background: #f8fafc;
        border-radius: 15px;
        padding: 25px;
        margin-bottom: 25px;
        border: 2px solid #e2e8f0;
        text-align: center;
    }

    .no-json-message {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: #6b7280;
        font-size: 1rem;
    }

    .no-json-message i {
        font-size: 1.2rem;
        color: #9ca3af;
    }

    /* JSON Extraction Indicator */
    .json-extraction-indicator {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #10b981;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        z-index: 1000;
        animation: slideInRight 0.3s ease-out;
    }

    .json-indicator-content {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
    }

    .json-indicator-content i {
        font-size: 1.2rem;
    }

    @keyframes slideInRight {
        from {
            transform: translateX(100%);
            opacity: 0;
        }
        to {
            transform: translateX(0);
            opacity: 1;
        }
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .dental-logo {
            flex-direction: column;
            gap: 15px;
        }

        .dental-logo h1 {
            font-size: 2.2rem;
        }

        .ai-bubble {
            max-width: 85%;
            padding: 18px 22px;
        }

        .dental-btn {
            padding: 20px 40px;
            flex-direction: column;
            gap: 15px;
        }

        .dental-chat-container {
            padding: 20px;
        }

        .storage-header {
            flex-direction: column;
            gap: 20px;
            text-align: center;
        }

        .storage-actions {
            flex-wrap: wrap;
            justify-content: center;
        }
    }

    /* Records Modal Styles */
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(5px);
        animation: fadeIn 0.3s ease;
    }

    .modal-content {
        background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
        margin: 2% auto;
        padding: 0;
        border: none;
        border-radius: 20px;

<script>
// Global variables
let isRecording = false;
let isPaused = false;
let isProcessing = false;
let mediaRecorder = null;
let audioStream = null;
let websocket = null;
let currentUserMessage = null;
let currentAIMessage = null;
    let isAITyping = false;

    let isAIResponding = false;
    let userMessageBuffer = '';
    let isUserTyping = false;
    let aiThinkingIndicator = null;
    let pendingInterimText = '';
    let pendingFinalText = '';

// Audio processing variables 
let audioContext;
let audioQueue = [];
let isPlaying = false;

// Web Speech API variables
let recognition = null;
let isWebSpeechActive = false;
let currentSpeechText = '';

// Conversation storage variables
let conversationData = {
    id: Date.now(),
    timestamp: new Date().toISOString(),
    messages: []
};

// Audio playback functions 
async function playNextInQueue() {
    console.log(' playNextInQueue called');
    console.log(' isPlaying:', isPlaying);
    console.log(' audioQueue.length:', audioQueue.length);
    console.log(' audioContext exists:', !!audioContext);
    
    if (isPlaying || audioQueue.length === 0) {
        console.log(' Not playing - isPlaying:', isPlaying, 'queue length:', audioQueue.length);
        return;
    }
    
    isPlaying = true;
    const pcmData = audioQueue.shift();
    console.log('Playing audio chunk:', pcmData.byteLength, 'bytes');
    
    try {
        console.log(' Converting PCM to AudioBuffer...');
        const audioBuffer = await pcmToAudioBuffer(pcmData);
        console.log(' AudioBuffer created:', audioBuffer.length, 'samples,', audioBuffer.sampleRate, 'Hz');
        
        const source = audioContext.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioContext.destination);
        
        source.onended = () => {
            console.log('🎵 Audio playback ended');
            isPlaying = false;
            // Resume Web Speech API when audio playback ends (only if queue is empty)
            // Check queue length after attempting to play next
            playNextInQueue();
            // Resume after a small delay to ensure queue is processed
            setTimeout(() => {
                if (audioQueue.length === 0 && isRecording && !isPaused && !isWebSpeechActive) {
                    resumeWebSpeechAPI();
                }
            }, 100);
        };
        
        console.log('Starting audio playback...');
        source.start(0);
        console.log('Audio playback started successfully');
        
    } catch (e) {
        console.error("Error playing audio:", e);
        isPlaying = false;
        playNextInQueue();
    }
}

// Web Speech API Functions
function initializeWebSpeechAPI() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        console.error('Web Speech API not supported in this browser');
        return null;
    }
    
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    
    recognition.lang = 'en-US'; // English only
    recognition.continuous = true;
    recognition.interimResults = true;
    
    recognition.onstart = () => {
        console.log('🎤 Web Speech API started');
        isWebSpeechActive = true;
        // Clear previous user message when starting new recognition
        currentSpeechText = '';
        pendingInterimText = '';
        pendingFinalText = '';
        if (currentUserMessage) {
            currentUserMessage = null;
        }
    };
    
    recognition.onresult = (event) => {
        let interimTranscript = '';
        let finalTranscript = '';
        
        for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcript = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
                finalTranscript += transcript + ' ';
                // Accumulate final text
                pendingFinalText += transcript + ' ';
            } else {
                interimTranscript += transcript;
            }
        }
        
        // Update pending transcripts
        pendingFinalText = pendingFinalText.trim();
        pendingInterimText = interimTranscript.trim();
        
        // Update user message display with interim and final results
        if (pendingInterimText || pendingFinalText) {
            const displayText = (pendingFinalText + ' ' + pendingInterimText).trim();
            currentSpeechText = displayText;
            
            // Create or update user message bubble
            if (!currentUserMessage) {
                currentUserMessage = createMessageBubble('user', '');
                const historyContainer = document.getElementById('conversationHistory');
                if (historyContainer) {
                    historyContainer.appendChild(currentUserMessage);
                }
            }
            
            const textElement = currentUserMessage.querySelector('.user-text');
            if (textElement) {
                textElement.textContent = displayText;
                
                // Apply styling based on what we have
                if (pendingInterimText && !pendingFinalText) {
                    // Only interim results - show in grey
                    textElement.classList.remove('final');
                    textElement.classList.add('interim');
                } else if (pendingFinalText) {
                    // Has final results - show in black (final text stays black)
                    textElement.classList.remove('interim');
                    textElement.classList.add('final');
                }
            }
            
            scrollToBottom();
        }
        
        // Send final transcript to Gemini
        if (finalTranscript.trim()) {
            console.log('📤 Sending text to Gemini:', finalTranscript.trim());
            sendTextToGemini(finalTranscript.trim());
            // Show thinking indicator
            showAIThinking();
        }
    };
    
    recognition.onerror = (event) => {
        console.error('Web Speech API error:', event.error);
        if (event.error === 'no-speech') {
            // This is normal - just restart if we're still recording
            if (isRecording && !isPaused) {
                setTimeout(() => {
                    if (isRecording && !isPaused) {
                        resumeWebSpeechAPI();
                    }
                }, 1000);
            }
        } else if (event.error === 'audio-capture') {
            updateStatus('Microphone not found. Please check your microphone.');
        } else if (event.error === 'not-allowed') {
            updateStatus('Microphone permission denied. Please allow microphone access.');
        }
    };
    
    recognition.onend = () => {
        console.log('🎤 Web Speech API ended');
        isWebSpeechActive = false;
        // Auto-restart if still recording
        if (isRecording && !isPaused) {
            setTimeout(() => {
                if (isRecording && !isPaused) {
                    resumeWebSpeechAPI();
                }
            }, 500);
        }
    };
    
    return recognition;
}

function pauseWebSpeechAPI() {
    if (recognition && isWebSpeechActive) {
        console.log('⏸️ Pausing Web Speech API');
        recognition.stop();
        isWebSpeechActive = false;
    }
}

function resumeWebSpeechAPI() {
    if (!recognition) {
        console.warn('Cannot resume Web Speech API - recognition not initialized');
        return;
    }
    
    if (!isWebSpeechActive && isRecording && !isPaused) {
        console.log('▶️ Resuming Web Speech API');
        try {
            recognition.start();
            // Don't set isWebSpeechActive here - let onstart event handle it
        } catch (e) {
            // If already started, ignore error
            if (e.name === 'InvalidStateError') {
                console.log('Web Speech API already started');
                isWebSpeechActive = true;
            } else {
                console.error('Error resuming Web Speech API:', e);
            }
        }
    }
}

function sendTextToGemini(text) {
    if (!websocket || websocket.readyState !== WebSocket.OPEN) {
        console.warn('Cannot send text - WebSocket not open');
        return;
    }
    
    if (!text.trim()) {
        console.warn('Cannot send empty text');
        return;
    }
    
    try {
        const message = JSON.stringify({
            type: 'text_input',
            text: text.trim()
        });
        websocket.send(message);
        console.log('✅ Text sent to Gemini:', text.trim());
        
        // Store user message
        storeUserMessage(text.trim());
        
        // Show thinking indicator
        showAIThinking();
        
        // Keep currentUserMessage visible - don't clear it immediately
        // It will be cleared when a new speech recognition starts
    } catch (error) {
        console.error('Error sending text to Gemini:', error);
    }
}

// Convert PCM data to AudioBuffer 
async function pcmToAudioBuffer(pcmData) {
    console.log(' pcmToAudioBuffer called with:', pcmData.byteLength, 'bytes');
    
    const dataView = new DataView(pcmData);
    const samples = new Float32Array(dataView.byteLength / 2);
    console.log(' Creating samples array with', samples.length, 'samples');
    
    for (let i = 0; i < samples.length; i++) {
        const int16 = dataView.getInt16(i * 2, true);
        samples[i] = int16 / (int16 < 0 ? 0x8000 : 0x7FFF);
    }
    
    console.log(' Sample range:', Math.min(...samples), 'to', Math.max(...samples));
    console.log(' Creating AudioBuffer with 24000 Hz sample rate');
    
    const audioBuffer = audioContext.createBuffer(1, samples.length, 24000);
    audioBuffer.getChannelData(0).set(samples);
    
    console.log(' AudioBuffer created successfully');
    return audioBuffer;
}

// Connect to WebSocket 
function connectWebSocket() {
  return new Promise((resolve, reject) => {
    // Use appropriate WebSocket protocol based on current page protocol
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}/ws/voice/`;
    
    console.log(' Connecting to WebSocket:', wsUrl);
    console.log(' Current location:', window.location.href);
    console.log(' Host:', window.location.host);
    
    websocket = new WebSocket(wsUrl);
    websocket.binaryType = 'arraybuffer';
    
    websocket.onopen = () => {
      console.log('WebSocket connected successfully');
      console.log('WebSocket readyState:', websocket.readyState);
      updateStatus('Connected - Starting microphone...');
      resolve();
    };
    
    websocket.onmessage = (event) => {
      console.log(' WebSocket message received');
      handleWebSocketMessage(event);
    };
    
    websocket.onerror = (error) => {
      console.error('WebSocket error:', error);
      console.error('WebSocket readyState:', websocket.readyState);
      updateStatus('Connection error - please try again');
      reject(error);
    };
    
    websocket.onclose = (event) => {
      console.log(' WebSocket closed:', event.code, event.reason);
      console.log(' Was clean close:', event.wasClean);
      isRecording = false;
      
      // Handle authentication failure
      if (event.code === 4001) {
        console.error('Authentication failed - please log in again');
        updateStatus('Authentication failed - please log in again');
        // Redirect to login page
        setTimeout(() => {
          window.location.href = '/login/';
        }, 2000);
      } else {
        updateStatus('Connection closed');
      }
    };
  });
}

// Check microphone permissions
async function checkMicrophonePermission() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    // If we get here, permission is granted
    stream.getTracks().forEach(track => track.stop());
    return true;
  } catch (error) {
    console.log('Microphone permission not granted:', error);
    return false;
  }
}

}

        console.log('LLM result:', data.result);
        
       

        
    } else if (data.type === 'ai_transcript') {
        console.log('AI transcript chunk:', data.text);
        
        // Hide thinking indicator when AI starts responding
        if (!isAIResponding) {
          hideAIThinking();
          pauseWebSpeechAPI();
        }
        
        // Mark AI as responding
        if (!isAIResponding) {
          isAIResponding = true;
          isAITyping = true;
        }
        
        // Accumulate AI message chunks with space between chunks
        if (aiMessageBuffer) {
          aiMessageBuffer += ' ' + data.text;
        } else {
          aiMessageBuffer += data.text;
        }
        
        // Create or update AI message
        if (!currentAIMessage) {
          currentAIMessage = createMessageBubble('ai', '');
          const historyContainer = document.getElementById('conversationHistory');
          if (historyContainer) {
            historyContainer.appendChild(currentAIMessage);
          }
        }
        
        // Update the display with the accumulated text
        const textElement = currentAIMessage.querySelector('.ai-text');
        if (textElement) {
          // Add smooth text transition
          textElement.style.transition = 'all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
          textElement.textContent = aiMessageBuffer;
          
          // Add a subtle animation to show the text is updating
          textElement.style.transform = 'scale(1.01)';
          setTimeout(() => {
            textElement.style.transform = 'scale(1)';
          }, 100);
        }
        
        scrollToBottom();
        
        // Check if this might be the end of the AI response
        // We'll assume it's complete after a delay with no new chunks
        clearTimeout(window.aiResponseTimeout);
        window.aiResponseTimeout = setTimeout(() => {
          if (isAIResponding) {
            console.log(' AI response complete:', aiMessageBuffer);
            
            // Store the complete AI message
            storeAIMessage(aiMessageBuffer);
            
            // Check if AI said the completion message
            console.log('Checking AI completion...');
            console.log('AI message buffer:', aiMessageBuffer);
            console.log('Looking for completion phrases...');
            
            if (aiMessageBuffer.toLowerCase().includes("thank you! i've added your products to the cart. you can now proceed to checkout.")) {
            console.log('✅ AI added products to cart - redirecting to cart page...');
 
              
              
              // Process conversation with LLM directly (not through stopConversation)
              setTimeout(async () => {
                // Check if user manually stopped the conversation
                if (isRecording === false && isPaused === false) {
                  console.log('User manually stopped - skipping auto-processing');
                  return;
                }
                
                console.log('Auto-triggering conversation processing...');
                
                // Disconnect websocket before processing animation
                if (websocket) {
                  console.log('Disconnecting websocket before animation...');
                  websocket.close();
                  websocket = null;
                }
                
                // Stop Web Speech API
                pauseWebSpeechAPI();
                if (recognition) {
                  recognition.abort();
                  recognition = null;
                }
                
                // Clean up audio resources
                if (audioContext && audioContext.state !== 'closed') {
                  audioContext.close().catch(console.error);
                }
                audioQueue = [];
                isPlaying = false;

                window.location.href = '/cart/';
                
              }, 3000); // Wait 3 seconds for the message to be fully displayed and AI to finish speaking
            }
            
            // Reset AI response state
            currentAIMessage = null;
            isAITyping = false;
            isAIResponding = false;
            aiMessageBuffer = '';
          }
        }, 2000); // Wait 2 seconds after last chunk
      }
    }
    // Handle binary audio data 
    else if (event.data instanceof ArrayBuffer) {
      console.log('Received audio from AI:', event.data.byteLength, 'bytes');
      console.log('Audio queue length before:', audioQueue.length);
      console.log('Is playing:', isPlaying);
      console.log('Audio context exists:', !!audioContext);
      
      // Pause Web Speech API when audio starts playing
      if (!isPlaying) {
        pauseWebSpeechAPI();
      }
      
      audioQueue.push(event.data);
      console.log('Audio queue length after:', audioQueue.length);
      
      if (!isPlaying && audioContext) {
        console.log('Starting audio playback...');
        playNextInQueue();
      } else {
        console.log('Audio not started - isPlaying:', isPlaying, 'audioContext:', !!audioContext);
      }
    }
    
  } catch (error) {
    console.error('Error parsing WebSocket message:', error);
  }
}

// Create message bubble
function createMessageBubble(role, text) {
  const messageItem = document.createElement('div');
  messageItem.className = `message-item ${role}-message`;
  
  const bubble = document.createElement('div');
  bubble.className = role === 'ai' ? 'ai-bubble' : 'user-bubble';
  
  // Create content container
  const content = document.createElement('div');
  content.className = 'bubble-content';
  
  // Create text element
  const textElement = document.createElement('p');
  textElement.textContent = text;
  textElement.className = role === 'ai' ? 'ai-text' : 'user-text';
  
  // Create timestamp
  const timestamp = document.createElement('div');
  timestamp.className = 'message-time';
  timestamp.textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  
  // Assemble the bubble
  content.appendChild(textElement);
  content.appendChild(timestamp);
  bubble.appendChild(content);
  
  // Style positioning
  if (role === 'user') {
    messageItem.style.justifyContent = 'flex-end';
    messageItem.style.display = 'flex';
    bubble.style.marginLeft = 'auto';
    bubble.style.maxWidth = '70%';
  } else {
    messageItem.style.justifyContent = 'flex-start';
    messageItem.style.display = 'flex';
    bubble.style.marginRight = 'auto';
    bubble.style.maxWidth = '85%';
  }
  
  messageItem.appendChild(bubble);
  return messageItem;
}

// Pause conversation
async function pauseConversation() {
  console.log("Pausing conversation...");
  console.log("isRecording:", isRecording, "isPaused:", isPaused);
  
  if (isRecording && !isPaused) {
    isPaused = true;
    isRecording = false;
    
    // Pause Web Speech API
    pauseWebSpeechAPI();
    
    // Keep WebSocket connection alive - don't close it!
    // websocket stays connected
    
    updateButtonStates('paused');
    updateStatus('Session paused - conversation held');
    console.log("Conversation paused successfully");
  } else {
    console.log("Cannot pause - not recording or already paused");
  }
}

// Resume conversation
async function resumeConversation() {
  console.log("Resuming conversation...");
  console.log("isPaused:", isPaused, "isRecording:", isRecording);
  
  if (isPaused) {
    isPaused = false;
    
    // Reconnect to WebSocket if needed (should still be connected)
    if (!websocket || websocket.readyState === WebSocket.CLOSED) {
      console.log("Reconnecting WebSocket...");
      await connectWebSocket();
    }
    
    // Resume Web Speech API
    isRecording = true;
    resumeWebSpeechAPI();
    
    updateButtonStates('recording');
    updateStatus('Listening... Speak now');
    console.log("Conversation resumed successfully");
  } else {
    console.log("Cannot resume - not paused");
  }
}

// Stop conversation
async function stopConversation() {
  console.log("===== STOP BUTTON PRESSED =====");
  
  // Prevent double-clicking
  if (isProcessing) {
    console.log("Already processing - ignoring duplicate click");
    return;
  }
  
  isProcessing = true;
  
  // Stop recording and clear chat immediately
  isRecording = false;
  isPaused = false;
  clearChatContainer();
  
  // Stop Web Speech API
  pauseWebSpeechAPI();
  if (recognition) {
    try {
      recognition.abort();
    } catch (e) {
      console.error('Error aborting recognition:', e);
    }
    recognition = null;
  }
  
  // Clean up audio resources
  if (audioContext && audioContext.state !== 'closed') {
    audioContext.close().catch(console.error);
  }
  audioQueue = [];
  isPlaying = false;
  
  // Close WebSocket
  if (websocket) {
    websocket.close();
    websocket = null;
  }
  
  // Reset button to Start Assessment
  const talkBtn = document.getElementById('talkBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resumeBtn = document.getElementById('resumeBtn');
  
  // Hide pause and resume buttons
  if (pauseBtn) pauseBtn.style.display = 'none';
  if (resumeBtn) resumeBtn.style.display = 'none';
  
  // Reset main button
  if (talkBtn) {
    talkBtn.disabled = false;
    talkBtn.style.opacity = '1';
    talkBtn.classList.remove('recording');
    talkBtn.querySelector('.btn-main').textContent = 'Start Assessment';
    talkBtn.querySelector('.btn-sub').textContent = 'Tap to begin your dental assessment';
    talkBtn.style.display = 'inline-flex';
    // Remove inline styles to use CSS classes
    talkBtn.style.background = '';
    talkBtn.style.boxShadow = '';
  }
  
  // Update status
  updateStatus('Assessment stopped - Ready for new assessment');
  
  // Reset processing flag
  isProcessing = false;
  
  console.log("Conversation stopped - no processing");
}


// Clear chat container
function clearChatContainer() {
  console.log("Clearing chat container...");
  
  const historyContainer = document.getElementById('conversationHistory');
  if (historyContainer) {
    historyContainer.innerHTML = '';
  }
  
  // Reset conversation data
  conversationData = {
    id: Date.now(),
    timestamp: new Date().toISOString(),
    messages: []
  };
  
  // Reset thinking indicator
  aiThinkingIndicator = null;
  
  console.log("Chat container cleared");
}



// Update button states for pause/resume functionality
function updateButtonStates(state) {
  const talkBtn = document.getElementById('talkBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resumeBtn = document.getElementById('resumeBtn');
  
  console.log("updateButtonStates called with state:", state);
  console.log("Current isRecording:", isRecording, "isPaused:", isPaused, "isProcessing:", isProcessing);
  
  // Hide all buttons first
  if (talkBtn) talkBtn.style.display = 'none';
  if (pauseBtn) pauseBtn.style.display = 'none';
  if (resumeBtn) resumeBtn.style.display = 'none';
  
  if (state === 'stopped') {
    if (talkBtn) {
      talkBtn.style.display = 'inline-flex';
      talkBtn.classList.remove('recording');
      talkBtn.querySelector('.btn-main').textContent = 'Start Assessment';
      talkBtn.querySelector('.btn-sub').textContent = 'Tap to begin your dental assessment';
      console.log("Button set to Start Assessment");
    }
  } else if (state === 'recording') {
    if (talkBtn) {
      talkBtn.style.display = 'inline-flex';
      talkBtn.classList.add('recording');
      talkBtn.querySelector('.btn-main').textContent = 'Stop Assessment';
      talkBtn.querySelector('.btn-sub').textContent = 'Tap to end conversation';
      console.log("Button set to Stop Assessment");
    }
    if (pauseBtn) pauseBtn.style.display = 'inline-flex';
  } else if (state === 'paused') {
    if (resumeBtn) resumeBtn.style.display = 'inline-flex';
    if (talkBtn) {
      talkBtn.style.display = 'inline-flex';
      // Keep the recording class to maintain red color
      talkBtn.classList.add('recording');
      talkBtn.querySelector('.btn-main').textContent = 'Stop Assessment';
      talkBtn.querySelector('.btn-sub').textContent = 'Tap to end conversation';
      console.log("Button set to Stop Assessment (paused)");
    }
  }
  
  console.log("Button state update complete");
}

// Update button text and style
function updateButton(text, className) {
  const button = document.getElementById('talkBtn');
  if (button) {
    // Update button content
    const btnMain = button.querySelector('.btn-main');
    if (btnMain) {

// Get CSRF token
function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}

    // If not recording and not paused, start conversation
    if (!isRecording && !isPaused) {

      console.log("Stopping conversation...");
      await stopConversation();

  const pauseBtn = document.getElementById('pauseBtn');

  if (resumeBtn) {

    };

  // Ensure initial state is properly set
  isRecording = false;
